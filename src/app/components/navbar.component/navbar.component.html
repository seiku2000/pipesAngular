<ul class="menu menu-horizontal bg-base-200 rounded-box my-2 w-full flex-col   md:flex-row md:justify-center  mb-5">
    @for (route of routes; track route) {
    <li class="w-full md:w-auto   ">
        <a class="justify-center text-center" [routerLink]="route.path"
            routerLinkActive="text-accent">{{route.title}}</a>
    </li>
    }
</ul>
