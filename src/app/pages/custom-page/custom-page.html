<section class="mx-5 mb-2">
    <h1 class="text-2xl font-bold"> Pipes personalizados</h1>
    <h3 class="text-2xl font-thin"> Pipes no incluidos en Angular</h3>
</section>

<div class="flex flex-col  ">
    <div class="stats shadow">
        <div class="stat">
            <div class="stat-title">Total Page Views</div>
            <div class="stat-value">{{name() | toogleCase:isUpperCase()}}</div>
            <div class="stat-desc">{{name()}}</div>
        </div>


    </div>
    <div class="flex justify-start m-5">
        <button (click)="onChangedName() " class="btn btn-primary w-auto">ChangedName</button>
    </div>

</div>
<div class="divider my-5"></div>



<div class="rounded-box border border-base-300 bg-base-100 shadow-xl">
    <div class="p-4 flex items-center justify-between gap-4 bg-base-200 border-b border-base-300 flex-wrap">
        <!-- Buscador DaisyUI -->
        <label class="input input-bordered flex items-center gap-2 w-full max-w-xs bg-base-100">
            <svg class="w-4 h-4 opacity-70" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
            </svg>
            <input type="text" class="grow" placeholder="Search for items" />
        </label>

        <!-- Dropdown DaisyUI -->
        <div class="dropdown dropdown-end">
            <div tabindex="0" role="button" class="btn btn-outline btn-sm gap-2">
                <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-width="2"
                        d="M18.796 4H5.204a1 1 0 0 0-.753 1.659l5.302 6.058a1 1 0 0 1 .247.659v4.874a.5.5 0 0 0 .2.4l3 2.25a.5.5 0 0 0 .8-.4v-7.124a1 1 0 0 1 .247-.659l5.302-6.059c.566-.646.106-1.658-.753-1.658Z" />
                </svg>
                Filter by
                <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7" />
                </svg>
            </div>
            <ul tabindex="0"
                class="dropdown-content menu bg-base-200 rounded-box z-10 w-40 p-2 shadow-lg border border-base-300 mt-1">
                <li><a>Color</a></li>
                <li><a>Category</a></li>
                <li><a>Price</a></li>
            </ul>
        </div>
    </div>

    <!-- Tabla DaisyUI envuelta en overflow-x-auto exclusivo para la tabla -->
    <div class="overflow-x-auto">
        <table class="table table-zebra w-full">
            <thead>
                <tr>
                    <th></th>
                    <th>ID</th>
                    <th>Nombre del heroe</th>
                    <th>Color</th>
                    <th>Liga</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr class="hover">
                    <td>
                        <label>
                            <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" />
                        </label>
                    </td>
                    <td>1</td>
                    <td class="font-bold text-base-content">
                        Apple MacBook Pro 17"
                    </td>
                    <td>Silver</td>
                    <td>Laptop</td>
                    <td>$2999</td>
                    <td>
                        <a href="#" class="link link-primary font-medium">Edit</a>
                    </td>
                </tr>

            </tbody>
        </table>
    </div>
</div>
